version: 2

updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'monthly'
    ignore:
      # typescript-eslint (via @screenly/edge-apps) cannot load under TypeScript 7 yet
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      bun:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns:
          - '*'
